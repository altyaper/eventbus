# Self-contained so it can be pasted into Portainer (Stacks → Web editor) or
# used via its Repository mode as-is. Local builds add docker-compose.build.yml
# on top (the make targets do that).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventbus}
      POSTGRES_DB: ${POSTGRES_DB:-eventbus_prod}
    # The postgres image applies POSTGRES_USER/PASSWORD/DB only when its volume
    # is first created and silently ignores later changes, so the app gets
    # locked out with "password authentication failed". This wrapper re-applies
    # them on every start, over the local socket (no password needed), so the
    # env above is always the source of truth. ($$ is compose's escape for $.)
    entrypoint:
      - sh
      - -c
      - |
        rm -f /tmp/credentials-synced
        docker-entrypoint.sh postgres &
        pid=$$!
        trap 'kill -TERM $$pid; wait $$pid; exit $$?' TERM INT

        # TCP readiness means the real server: the temporary one that
        # first-time init runs listens on the socket only.
        until pg_isready -q -h 127.0.0.1 -U "$$POSTGRES_USER"; do sleep 1; done

        if psql -v ON_ERROR_STOP=1 -q -U "$$POSTGRES_USER" -d postgres \
             -v u="$$POSTGRES_USER" -v p="$$POSTGRES_PASSWORD" -v d="$$POSTGRES_DB" <<'SQL'
        ALTER ROLE :"u" PASSWORD :'p';
        SELECT format('CREATE DATABASE %I', :'d')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'d')\gexec
        SQL
        then
          touch /tmp/credentials-synced
          echo "eventbus: credentials for $$POSTGRES_USER synced"
        else
          echo "eventbus: could not sync credentials. This volume was most likely" \
               "created with a different POSTGRES_USER; remove the volume to start fresh." >&2
        fi

        wait $$pid
    volumes:
      - db_data:/var/lib/postgresql/data
    # Loopback only: reachable from the Pi itself (e.g. TablePlus over SSH),
    # never from the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Healthy only after the sync above, so the app never races it.
      test: ["CMD-SHELL", "test -f /tmp/credentials-synced && pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # Published to Docker Hub by CI on every push to main (and `make docker-push`).
    image: jorgechavzns/eventbus:latest
    restart: unless-stopped
    # Opts in to the watchtower service below; the db is never touched.
    labels:
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Discrete vars rather than a DATABASE_URL, so the password needs no
      # URL-encoding (see config/runtime.exs).
      DATABASE_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-eventbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventbus}
      POSTGRES_DB: ${POSTGRES_DB:-eventbus_prod}
      # Required, 64+ bytes; the app refuses to boot otherwise (runtime.exs).
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST:-raspberrypi.local}
      # Other hosts the UI is reached at, comma-separated (e.g. a domain behind
      # a reverse proxy plus the LAN IP). Without this, live updates only work
      # when browsing via PHX_HOST. Browser apps using /socket can instead be
      # allowed by the superadmin at /settings, without a redeploy.
      PHX_EXTRA_ORIGINS: ${PHX_EXTRA_ORIGINS:-}
      PORT: "4000"
      # Optional key for the first-run /setup screen. Leave unset to have one
      # generated on first boot and printed in the logs (docker compose logs app)
      # until setup is done. Publishing uses per-application credentials.
      EVENTBUS_API_KEY: ${EVENTBUS_API_KEY:-}
      # Sends account emails (confirmation, password reset) through Resend.
      # Leave unset to only log them, links included.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Upgrading an install from before email accounts: the existing
      # superadmin's email. The migration refuses to run without it.
      EVENTBUS_ADMIN_EMAIL: ${EVENTBUS_ADMIN_EMAIL:-}
    ports:
      - "4000:4000"

  # Deploys: polls Docker Hub and, when CI has pushed a new :latest, pulls it
  # and recreates the app container with the same settings (migrations run on
  # boot). The Pi only makes outbound requests, so nothing needs exposing.
  # Roll back by pinning app's image to a :sha-<short> tag. The socket gives it
  # full control of Docker on this host. This is a maintained fork: the
  # original containrrr/watchtower hasn't been published since January 2024.
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Only containers labelled com.centurylinklabs.watchtower.enable=true.
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      # Delete the replaced image so old releases don't fill the SD card.
      WATCHTOWER_CLEANUP: "true"

volumes:
  db_data:
