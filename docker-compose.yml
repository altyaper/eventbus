services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventbus}
      POSTGRES_DB: ${POSTGRES_DB:-eventbus_prod}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventbus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${POSTGRES_USER:-eventbus}:${POSTGRES_PASSWORD:-eventbus}@db/${POSTGRES_DB:-eventbus_prod}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-secret}
      PHX_HOST: ${PHX_HOST:-raspberrypi.local}
      PORT: "4000"
      EVENTBUS_API_KEY: ${EVENTBUS_API_KEY:-dev-secret}
    ports:
      - "4000:4000"

volumes:
  db_data:
